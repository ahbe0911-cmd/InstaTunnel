name: Build InstaTunnel APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"

      - name: Fetch official tun2socks engine
        run: |
          rm -rf app/src/main/jni/hev-socks5-tunnel
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/heiher/hev-socks5-tunnel.git app/src/main/jni/hev-socks5-tunnel

      - name: Fetch Xray Android core
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.8.20/libv2ray.aar \
            -o app/libs/libv2ray.aar
          test -s app/libs/libv2ray.aar
          ls -lh app/libs/libv2ray.aar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk InstaTunnel-0.4.0-debug.apk
          ls -lh InstaTunnel-0.4.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaTunnel-0.4.0-APK
          path: InstaTunnel-0.4.0-debug.apk
          retention-days: 14
