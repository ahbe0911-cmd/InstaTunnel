name: Build InstaTunnel APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Fetch tun2socks engine
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/zak20090/hev-socks5-tunnel-android.git third_party/hev

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk InstaTunnel-debug.apk
          ls -lh InstaTunnel-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaTunnel-APK
          path: InstaTunnel-debug.apk
          retention-days: 14
